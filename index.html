<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Markas United Go</title>
<meta name="description" content="Kantor 3D tempat 9 agen AI United Go bekerja live di kafe co-working bergaya Old Trafford Paddock: riset, menulis, mendesain, membuat Reels, memposting, dan membalas komentar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#da291c;--red2:#a3150c;--gold:#fbe122;--ink:#fff7ee;--muted:#d9c9bd;--panel:rgba(22,10,8,.78);--line:rgba(255,220,190,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#120806;color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;display:block}
  .bar{position:fixed;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:10px;z-index:5;pointer-events:none}
  .brand{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
  .brand b{font-family:Anton;font-size:22px;letter-spacing:.5px}.brand b span{color:var(--gold)}
  .brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:#43d17a;box-shadow:0 0 10px #43d17a}
  .dot.busy{background:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .spacer{flex:1}
  .card{position:fixed;z-index:4;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:14px;width:310px}
  .card h3{font-family:Anton;font-weight:400;font-size:19px;letter-spacing:.6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .card h3 em{font-style:normal;font-family:Inter;font-size:11px;color:var(--muted);letter-spacing:1px}
  .card h3{cursor:pointer;user-select:none}
  .card.min>*:not(h3){display:none}
  .card.min{padding-bottom:6px}
  @media (min-width:821px){ .card h3:after{content:'–';font-family:Inter;font-size:16px;color:var(--muted);margin-left:8px} .card.min h3:after{content:'+'} }
  #sched{left:12px;top:78px}
  #post{right:12px;top:78px}
  #logc{right:12px;bottom:76px;max-height:28vh;overflow:auto}
  .sitem{display:grid;grid-template-columns:22px 46px 1fr;gap:6px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:13px}
  .sitem:last-child{border:0}
  .sitem .t{font-weight:800;font-variant-numeric:tabular-nums}
  .sitem .w{font-size:11px;color:var(--muted)}
  .sitem.next{background:rgba(251,225,34,.12);border-radius:8px}
  .sitem.next .t{color:var(--gold)}
  .tabs{display:flex;gap:6px;margin:4px 0 6px}
  .tabs button{flex:1}
  button{font:600 12px Inter;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
  button.on{background:var(--red);border-color:var(--red)}
  .week{font-size:12px;display:none}
  .week div{padding:5px 0;border-bottom:1px dashed var(--line)}.week div.today{color:var(--gold);font-weight:800}
  #pcov{width:100%;aspect-ratio:4/5;border-radius:10px;background:#2a1410 center/cover no-repeat;margin-bottom:8px;max-height:220px}
  #ptitle{font-weight:800;font-size:14px;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1)}
  .chip.ok{background:#1f6f3c}.chip.warn{background:#8a6a00}.chip.err{background:#8a1a12}
  .log{font-size:12px;line-height:1.45}.log div{padding:3px 0;border-bottom:1px dashed var(--line)}.log b{color:var(--gold)}
  .bottom{position:fixed;left:12px;right:12px;bottom:10px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .roster{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
  .roster button{white-space:nowrap}
  #snd{background:var(--gold);color:#1b0c00;border-color:var(--gold);font-weight:800}
  #snd.off{background:rgba(255,255,255,.07);color:var(--ink);border-color:var(--line)}
  #tags{position:fixed;inset:0;pointer-events:none;z-index:3}
  .tag{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;transition:opacity .2s}
  .tag .nm{display:inline-block;background:rgba(18,6,4,.82);border:1px solid rgba(255,255,255,.18);border-left:4px solid var(--red);border-radius:9px;padding:3px 9px 4px;font-size:12px;font-weight:800;line-height:1.15}
  .tag .nm small{display:block;font-size:10px;font-weight:600;color:var(--gold);letter-spacing:.4px}
  .bub{position:absolute;transform:translate(-50%,-100%);max-width:230px;background:#fffaf2;color:#2a0f08;border-radius:14px;padding:8px 11px;font-size:13px;font-weight:600;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
  .bub:after{content:"";position:absolute;left:50%;bottom:-7px;border:8px solid transparent;border-top-color:#fffaf2;border-bottom:0;transform:translateX(-50%)}
  .bub.show{opacity:1}
  .bub.loud{background:var(--gold)}
  #hint{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;display:none}
  .mtabs{display:none}
  @media (max-width:820px){
    .card{left:8px!important;right:8px!important;width:auto;top:auto!important;bottom:118px;max-height:46vh;overflow:auto;display:none}
    .card.open{display:block}
    .mtabs{display:flex;gap:6px;position:fixed;left:8px;right:8px;bottom:62px;z-index:5}
    .mtabs button{flex:1}
    .brand b{font-size:18px}.brand small{font-size:9px}
    .pill{font-size:11px;padding:6px 10px}
    #logc{max-height:46vh}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tags"></div>

<div class="bar">
  <div class="brand"><div><b>UNITED <span>GO</span></b><small>Old Trafford Paddock · kantor AI</small></div></div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="state">Kantor santai</span></div>
  <div class="pill" id="clock">--:-- WIB</div>
</div>

<div class="card" id="sched">
  <h3>JADWAL KONTEN <em id="hari">HARI INI</em></h3>
  <div class="tabs"><button class="on" id="tToday">Hari ini</button><button id="tWeek">Minggu ini</button></div>
  <div id="today"></div>
  <div class="week" id="week"></div>
</div>

<div class="card" id="post">
  <h3>POSTINGAN TERAKHIR <em id="pwhen"></em></h3>
  <div id="pcov"></div>
  <div id="ptitle">Menunggu laporan shift pertama…</div>
  <div class="chips" id="pchips"></div>
</div>

<div class="card" id="logc"><h3>AKTIVITAS</h3><div class="log" id="log"></div></div>

<div class="mtabs"><button data-c="sched">🗓️ Jadwal</button><button data-c="post">🖼️ Terakhir</button><button data-c="logc">📋 Aktivitas</button></div>

<div class="bottom">
  <button id="snd" class="off">🔇 Nyalakan suara</button>
  <button id="cam">🎥 Kamera</button>
  <div class="roster" id="roster"></div>
</div>
<div id="hint"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ======================================================================
   MARKAS UNITED GO — kafe co-working bergaya Old Trafford Paddock
   Data live: status.json + reels.json (laporan shift) dan /live dari bot
   (pekerjaan yang sedang berjalan di GitHub Actions).
   ====================================================================== */
const LIVE_URL = 'https://united-go-bot.arifansklub.workers.dev/live';
const AGENT_OF = {manager:'raka',scout:'dimas',writer:'sari',designer:'bima',monetizer:'tari',publisher:'yoga',analyst:'nadia',community:'fajar',reels:'reza'};
const CAL = {0:['mu_news','fpl_differential','mu_news','engagement_poll'],1:['mu_news','price_watch','mu_news','engagement_poll'],
  2:['mu_news','fixture_preview','mu_news','engagement_poll'],3:['mu_news','fpl_captain','mu_news','price_watch'],
  4:['mu_news','fpl_differential','mu_news','promo_tool'],5:['mu_news','fpl_captain','mu_news','engagement_poll'],6:['mu_news','price_watch','mu_news','engagement_poll']};
const SLOTS = ['08:00','12:00','16:00','19:00'];
const KIND = {mu_news:'Berita MU',fpl_captain:'Kapten FPL',fpl_differential:'Differential FPL',price_watch:'Price Watch',fixture_preview:'Preview Laga',engagement_poll:'Polling Debat',promo_tool:'Promo FPL Squad Hack'};
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const TEAMS = {office:['raka','dimas','sari','bima','tari','yoga'], reels:['raka','dimas','reza'], reply:['fajar'], analyze:['nadia','raka']};

/* ---------- tim (jersey / jaket United) ---------- */
const TEAM = [
 {id:'dimas',name:'Dimas',role:'Riset Data',      outfit:'jersey', num:7,  skin:'#c68b5f',hair:'#1b1210',style:'buzz', glasses:true, female:false, pitch:1.0, rate:1.05},
 {id:'sari', name:'Sari', role:'Copywriter',      outfit:'jersey', num:10, skin:'#e0aa82',hair:'#2b1611',style:'bun',  female:true,  pitch:1.25,rate:1.05},
 {id:'bima', name:'Bima', role:'Desainer Grafis', outfit:'jacketW',       skin:'#b67b52',hair:'#140c0a',style:'cap',  female:false, pitch:0.95,rate:1.0},
 {id:'tari', name:'Tari', role:'Monetisasi',      outfit:'jersey', num:17, skin:'#d79c74',hair:'#3a1d12',style:'long', female:true,  pitch:1.3, rate:1.05},
 {id:'raka', name:'Raka', role:'Manajer Kantor',  outfit:'jacket',        skin:'#c68a5e',hair:'#120c0a',style:'short',female:false, pitch:0.85,rate:0.98},
 {id:'yoga', name:'Yoga', role:'Publisher',       outfit:'jersey', num:9,  skin:'#a8714a',hair:'#0f0a08',style:'curly',female:false, pitch:1.0, rate:1.08},
 {id:'nadia',name:'Nadia',role:'Analis',          outfit:'jacket',        skin:'#e3b08b',hair:'#24130e',style:'long', glasses:true, female:true, pitch:1.2, rate:1.0},
 {id:'fajar',name:'Fajar',role:'Komunitas',       outfit:'jersey', num:11, skin:'#bf8458',hair:'#160e0b',style:'short',headset:true,female:false,pitch:1.1,rate:1.1},
 {id:'reza', name:'Reza', role:'Video Reels',     outfit:'jacket',        skin:'#b98257',hair:'#120c10',style:'cap',  female:false, pitch:1.05,rate:1.05},
];
const byId = id => TEAM.find(a=>a.id===id);

/* ---------- three.js dasar ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1a0c08'); scene.fog = new THREE.Fog('#1a0c08', 38, 70);
const camera = new THREE.PerspectiveCamera(42, 1, .1, 200);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.47; controls.minDistance = 6; controls.maxDistance = 46;
const CAMS = [{n:'kafe',p:[-1,9.5,13.5],t:[-1,1.5,-4]},{n:'meja kerja',p:[-3,4.6,2.2],t:[-3,1.5,-5.5]},{n:'lounge',p:[-5,4.8,12.5],t:[-12,1.1,5.8]},{n:'bar kopi',p:[6,5,3],t:[13.5,1.4,-7]}];
let camIdx=0, follow=null;
function setCam(i){ camIdx=i; follow=null; const c=CAMS[i]; tweenCam(c.p,c.t); }
let camT=null; function tweenCam(p,t){ camT={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t),k:0}; }
camera.position.set(0,22,34); controls.target.set(0,1.6,-2); setCam(0);

/* ---------- lampu ---------- */
scene.add(new THREE.HemisphereLight('#ffe7cf','#3a1a10',.55));
const sun = new THREE.DirectionalLight('#ffe2c0', 1.1); sun.position.set(-10,22,14); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-24,right:24,top:16,bottom:-16,near:1,far:70}); sun.shadow.bias=-0.0004; scene.add(sun);
const fill = new THREE.PointLight('#ff8a5c',.6,30); fill.position.set(0,6,-9); scene.add(fill);

/* ---------- tekstur kanvas ---------- */
function cvs(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t; }
const std = (o) => new THREE.MeshStandardMaterial(Object.assign({roughness:.75,metalness:.05},o));
function mesh(geo,mat,cast=true,recv=true){ const m=new THREE.Mesh(geo,mat); m.castShadow=cast; m.receiveShadow=recv; return m; }
function add(o,x=0,y=0,z=0,parent=scene){ o.position.set(x,y,z); parent.add(o); return o; }

const woodTex = cvs(1024,512,(g,w,h)=>{ // lantai papan kayu walnut
  g.fillStyle='#3f2618'; g.fillRect(0,0,w,h);
  for(let r=0;r<h/32;r++){ let x=-(r*97%256);
    while(x<w){ const L=180+Math.random()*160, v=Math.random()*26;
      const gr=g.createLinearGradient(0,r*32,0,r*32+32); gr.addColorStop(0,`rgb(${96+v|0},${60+v*.6|0},${38+v*.4|0})`); gr.addColorStop(1,`rgb(${82+v|0},${50+v*.6|0},${31+v*.4|0})`);
      g.fillStyle=gr; g.fillRect(x+1,r*32+1,L-2,30);
      g.strokeStyle='rgba(255,255,255,.035)'; for(let k=0;k<3;k++){ g.beginPath(); g.moveTo(x+8,r*32+6+k*9); g.bezierCurveTo(x+L*.3,r*32+4+k*9,x+L*.6,r*32+10+k*9,x+L-8,r*32+6+k*9); g.stroke(); }
      x+=L; } }
});
woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping; woodTex.repeat.set(3,5);
const brickTex = cvs(512,512,(g,w,h)=>{ // dinding bata merah khas Old Trafford
  g.fillStyle='#5a1d14'; g.fillRect(0,0,w,h);
  for(let r=0;r<h/32;r++) for(let c=-1;c<w/64+1;c++){ const x=c*64+(r%2)*32, y=r*32, v=Math.random()*28;
    g.fillStyle=`rgb(${140+v|0},${48+v*.4|0},${34+v*.3|0})`; g.fillRect(x+2,y+2,60,28); }
});
brickTex.wrapS=brickTex.wrapT=THREE.RepeatWrapping; brickTex.repeat.set(5,1.6);

/* ---------- ruangan ---------- */
const floor = mesh(new THREE.BoxGeometry(38,.3,26), std({map:woodTex,roughness:.6}),false,true); add(floor,0,-.15,0);
const backWall = mesh(new THREE.BoxGeometry(38,8,.4), std({map:brickTex}),false,true); add(backWall,0,4,-11.2);
const leftWall = mesh(new THREE.BoxGeometry(.4,8,26), std({map:brickTex.clone()}),false,true); add(leftWall,-19.2,4,0);
leftWall.material.map.repeat.set(4,1.6); leftWall.material.map.needsUpdate=true;
const rightWall = mesh(new THREE.BoxGeometry(.4,8,22), std({color:'#2a1512'}),false,true); add(rightWall,19.2,4,0);
// karpet lapangan di lounge
const pitch = cvs(512,320,(g,w,h)=>{ for(let i=0;i<8;i++){ g.fillStyle=i%2?'#2f7d3a':'#2a7234'; g.fillRect(i*w/8,0,w/8,h);} g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=6;
  g.strokeRect(14,14,w-28,h-28); g.beginPath(); g.moveTo(w/2,14); g.lineTo(w/2,h-14); g.stroke(); g.beginPath(); g.arc(w/2,h/2,46,0,7); g.stroke(); g.strokeRect(14,h/2-70,70,140); g.strokeRect(w-84,h/2-70,70,140); });
add(mesh(new THREE.BoxGeometry(9,.04,6), std({map:pitch,roughness:.95}),false,true),-12,0.02,6);

// jendela besar ke tribun stadion
const standCanvas = document.createElement('canvas'); standCanvas.width=1600; standCanvas.height=420;
const standTex = new THREE.CanvasTexture(standCanvas); standTex.encoding=THREE.sRGBEncoding;
function drawStand(hour){
  const g=standCanvas.getContext('2d'), w=1600, h=420;
  const night = hour<6||hour>=18, dusk = hour>=16&&hour<18;
  const sky=g.createLinearGradient(0,0,0,h*.45); sky.addColorStop(0, night?'#081028':dusk?'#3a2a6e':'#5fa8e8'); sky.addColorStop(1, night?'#1b2140':dusk?'#ff8a5c':'#cfe7fb');
  g.fillStyle=sky; g.fillRect(0,0,w,h);
  g.fillStyle='#d8d8d8'; g.fillRect(0,40,w,18); g.fillStyle='#9aa0a6'; for(let x=0;x<w;x+=80) g.fillRect(x,58,6,40); // atap kantilever
  for(let r=0;r<11;r++){ const y=100+r*25; g.fillStyle=r%2?'#b3180f':'#c41d12'; g.fillRect(0,y,w,22); g.fillStyle='rgba(0,0,0,.18)'; for(let x=(r%2)*9;x<w;x+=18) g.fillRect(x,y+15,8,7); }
  g.font='bold 110px Anton, Impact, sans-serif'; g.fillStyle='rgba(255,255,255,.9)'; g.textAlign='center'; g.fillText('MANCHESTER UNITED', w/2, 300);
  g.fillStyle='#1f6d2c'; g.fillRect(0,385,w,35); // tepi lapangan
  if(night){ for(const x of [80,w-80]){ const gr=g.createRadialGradient(x,30,4,x,30,160); gr.addColorStop(0,'rgba(255,255,230,.95)'); gr.addColorStop(1,'rgba(255,255,230,0)'); g.fillStyle=gr; g.fillRect(x-160,0,320,200);} }
  standTex.needsUpdate=true;
}
const win = mesh(new THREE.PlaneGeometry(26,6.6), new THREE.MeshBasicMaterial({map:standTex,toneMapped:false}),false,false); add(win,-3,4.3,-10.98);
const frameMat=std({color:'#1b0e0a',roughness:.4,metalness:.3});
[[-3,7.65,26.6,.3],[-3,.95,26.6,.3]].forEach(([x,y,w,h])=>add(mesh(new THREE.BoxGeometry(w,h,.25),frameMat),x,y,-10.9));
for(let i=0;i<=6;i++) add(mesh(new THREE.BoxGeometry(.18,6.6,.25),frameMat),-16+i*26/6,4.3,-10.9);

// tulisan besar & neon
function labelPlane(text,color,w,h,font=200,glow=true){
  const t=cvs(1024,Math.round(1024*h/w),(g,W,H)=>{ g.font=`${Math.round(H*.72)}px Anton, Impact, sans-serif`; g.textAlign='center'; g.textBaseline='middle';
    if(glow){ g.shadowColor=color; g.shadowBlur=H*.18; } g.fillStyle=color; g.fillText(text,W/2,H/2+H*.04); });
  return mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:t,transparent:true,toneMapped:false}),false,false);
}
add(labelPlane('THEATRE OF DREAMS · UNITED GO','#ff3b2b',13,1.0),-3,0.45,-10.97);
const neonCafe = labelPlane('PADDOCK CAFÉ','#ffb347',6.5,1.3); add(neonCafe,14,6.1,-10.95);

/* ---------- papan jadwal besar (dinding kiri) ---------- */
const boardCanvas=document.createElement('canvas'); boardCanvas.width=1024; boardCanvas.height=640;
const boardTex=new THREE.CanvasTexture(boardCanvas); boardTex.encoding=THREE.sRGBEncoding;
const board = mesh(new THREE.PlaneGeometry(9.6,6), new THREE.MeshBasicMaterial({map:boardTex,toneMapped:false}),false,false);
board.rotation.y=Math.PI/2; add(board,-18.95,4.2,-1.5);
add(mesh(new THREE.BoxGeometry(.2,6.3,9.9),std({color:'#0d0705',metalness:.4,roughness:.3})),-19.02,4.2,-1.5);

/* ---------- bar kopi ---------- */
const counter = mesh(new THREE.BoxGeometry(7,1.15,1.3), std({color:'#2a1611',roughness:.5})); add(counter,14,.58,-8.4);
add(mesh(new THREE.BoxGeometry(7.2,.1,1.5), std({color:'#d9c3a5',roughness:.3})),14,1.2,-8.4);
add(mesh(new THREE.BoxGeometry(7,.14,1.3), std({color:'#da291c',emissive:'#5a0a05',roughness:.5})),14,.35,-7.73).scale.z=.05;
const machine=new THREE.Group(); add(machine,12.2,1.25,-8.6);
machine.add(mesh(new THREE.BoxGeometry(1.3,.9,.7),std({color:'#c9ced3',metalness:.85,roughness:.25})));
machine.children[0].position.y=.45; const spout=mesh(new THREE.CylinderGeometry(.05,.05,.25,8),std({color:'#333',metalness:.8})); spout.position.set(0,.25,.38); machine.add(spout);
for(let i=0;i<4;i++){ const cup=mesh(new THREE.CylinderGeometry(.09,.07,.18,12),std({color:'#fff8ef'})); add(cup,14+i*.32,1.34,-8.2); }

/* ---------- suara (Web Speech API, gratis di browser) ---------- */
let soundOn=false, voices=[]; const sndBtn=document.getElementById('snd');
function loadVoices(){ voices=(speechSynthesis.getVoices?speechSynthesis.getVoices():[]).filter(v=>/^id|indones/i.test(v.lang+' '+v.name)); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; } else sndBtn.style.display='none';
function voiceFor(a){ if(!voices.length) return null; const fem=voices.find(v=>/gadis|damayanti|female|wanita|perempuan/i.test(v.name)), mal=voices.find(v=>/ardi|male|pria/i.test(v.name));
  return a.female ? (fem||voices[0]) : (mal||voices.find(v=>v!==fem)||voices[0]); }
let speaking=false;
function speak(a,text,force){
  if(!soundOn || !('speechSynthesis' in window)) return null;
  if(speaking && !force) return null;          // obrolan latar tidak menumpuk suara
  const u=new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/×/g,' kali '));
  u.lang='id-ID'; const v=voiceFor(a); if(v) u.voice=v; u.pitch=a.pitch; u.rate=a.rate; u.volume=1;
  speaking=true; return new Promise(res=>{ const done=()=>{ speaking=false; res(); }; u.onend=done; u.onerror=done; speechSynthesis.speak(u); setTimeout(done, 12000); });
}
let actx=null; function chime(){ if(!soundOn) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [880,1175,1568].forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type='sine'; g.gain.setValueAtTime(0,actx.currentTime+i*.12);
    g.gain.linearRampToValueAtTime(.18,actx.currentTime+i*.12+.02); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+i*.12+.5); o.connect(g).connect(actx.destination); o.start(actx.currentTime+i*.12); o.stop(actx.currentTime+i*.12+.55); }); }catch(e){} }

  a.bub.textContent=text; a.bub.classList.toggle('loud',!!opt.loud); a.bub.classList.add('show'); a.talking=1;
  const tts=speak(a,text,opt.force); const minMs=Math.max(1600,text.length*55);

const inLounge=p=>p.x<-8.5 && p.z>2.4;
const loungeApproach=p=>({x:p.x,z:p.z<6?4.95:7.05});
function route(a,b){ const pts=[]; const fz=-2.6;
  if(inLounge(a)){ pts.push(loungeApproach(a)); pts.push({x:-7.6,z:6}); a={x:-7.6,z:6}; }
  if(a.z<fz) pts.push({x:a.x,z:fz});
  if(inLounge(b)){ pts.push({x:-7.6,z:Math.max(a.z,fz)}); pts.push({x:-7.6,z:6}); pts.push(loungeApproach(b)); pts.push({x:b.x,z:b.z}); return pts; }
  pts.push({x:b.x,z:Math.max(b.z,fz)}); pts.push({x:b.x,z:b.z}); return pts; }
function walkTo(a,target,tok,run){
  a.pose='walk'; a.speed=run?3.3:1.7;
  a.path=route({x:a.pos.x,z:a.pos.z},target);
  return new Promise((res,rej)=>{ a.onArrive=res; a.onAbort=rej; a.walkTok=tok; });
}
async function goDesk(a,tok,run){ const s=DESKS[a.id].seat; if(Math.hypot(a.pos.x-s.x,a.pos.z-s.z)>.15) await walkTo(a,s,tok,run); a.face=Math.PI; a.pose='sit'; }

async function deskWork(a,tok,ms){ await goDesk(a,tok); a.pose='type'; setScreen(a,false); const end=performance.now()+ms;
  while(performance.now()<end){ await hold(a,tok,2500+Math.random()*4000); if(Math.random()<.25) await say(a,MUTTER[a.id][Math.random()*MUTTER[a.id].length|0]); } }
async function coffeeBreak(a,tok){ const spot={x:11.8+Math.random()*4.6,z:-6.3}; await walkTo(a,spot,tok); a.face=Math.PI; a.pose='stand';
  await say(a,COFFEE[Math.random()*COFFEE.length|0]); a.cup.visible=true; a.pose='sip'; await hold(a,tok,2600); a.pose='stand'; await hold(a,tok,2200); a.pose='sip'; await hold(a,tok,2000); }
async function discuss(group,tok0){
  const spots=[{x:-12.9,z:3.8,f:0},{x:-12,z:8.2,f:Math.PI},{x:-11.1,z:3.8,f:0}]; const high=[{x:7,z:4.7,f:Math.PI*.8},{x:9,z:4.7,f:-Math.PI*.8},{x:8,z:6.6,f:Math.PI}];
  const S=Math.random()<.55?spots:high; const toks=group.map(a=>a.token);
  await Promise.all(group.map((a,i)=>walkTo(a,S[i],a.token).then(()=>{ a.face=S[i].f; a.pose=S===spots?'sitlow':'stand'; })));
  const dlg=TALKS[Math.random()*TALKS.length|0];
  for(const [k,line] of dlg){ const a=group[k%group.length]; if(a.token!==toks[group.indexOf(a)]) throw ABORT; a.pose=(a.pose==='sitlow'?'sitlow':'talk'); await say(a,line); if(a.pose==='talk') a.pose='stand'; }
}

/* ---------- sutradara: kehidupan kantor sehari-hari ---------- */
let globalBusy=false, busyTeam=new Set();
async function life(a){ // dijalankan untuk tiap karyawan
  while(true){
    const tok=a.token;
    try{
      if(a.locked){ await sleep(500); continue; }
      await deskWork(a,tok,6000+Math.random()*14000);
      if(a.locked || busyTeam.has(a.id)) continue;
      const away=TEAM.filter(x=>x.away).length;
      if(away<3 && Math.random()<.45){
        a.away=true;
        if(Math.random()<.5) await coffeeBreak(a,tok);
        else { const mates=TEAM.filter(x=>x!==a && !x.away && !x.locked && !busyTeam.has(x.id)); if(mates.length){ const b=mates[Math.random()*mates.length|0];
            b.away=true; b.locked=true; interrupt(b);
            try{ await discuss([a,b],tok); } finally { b.away=false; if(!busyTeam.has(b.id)) b.locked=false; } } }
        a.cup.visible=false; a.away=false;
      }
    }catch(e){ if(e!==ABORT) console.error(e); a.away=false; await sleep(200); }
  }
}

  if(replaying) return; replaying=true;
  const steps=(run.steps||[]).map(s=>({...s,who:AGENT_OF[s.agent]||'raka'})).filter(s=>byId(s.who));
  const ids=[...new Set(steps.map(s=>s.who))]; ids.forEach(id=>{ const a=byId(id); a.locked=true; busyTeam.add(id); interrupt(a); });
  setState(true, run.label||'Shift berjalan');
  try{

      try{ await goDesk(a,tok,true); a.pose='type'; setScreen(a,true); log(a.name,s.msg,s.ok===false);
        await say(a,s.msg.length>90?s.msg.slice(0,88)+'…':s.msg,{force:true}); await hold(a,tok,s.who==='bima'||s.who==='reza'?2600:1400);

        if(nx && nx.who!==s.who && ho){ const d=DESKS[nx.who].seat; await walkTo(a,{x:d.x+.9,z:-3.9},tok,true); a.face=Math.PI; a.pose='talk'; await say(a,ho,{force:true}); await goDesk(a,tok,true); a.pose='type'; }
      }catch(e){}
    }

      TEAM.forEach(a=>{ if(a.pose==='cheer') a.pose=a.pos.z<-4.5?'type':'stand'; });

}

/* ---------- animasi per frame ---------- */
const clock=new THREE.Clock(); const lerp=(a,b,k)=>a+(b-a)*k;
function targetPose(a,t){
  const P={hipY:.95,thigh:[0,0],knee:[0,0],sh:[[0,0],[0,0]],el:[-.08,-.08],head:0,lean:0};
  switch(a.pose){
    case 'walk': { const ph=a.phase, A=a.speed>2.5?.85:.55; P.thigh=[Math.sin(ph)*A,-Math.sin(ph)*A]; P.knee=[Math.max(0,-Math.sin(ph))*A*1.3,Math.max(0,Math.sin(ph))*A*1.3];
      P.sh=[[-Math.sin(ph)*A*.8,.05],[Math.sin(ph)*A*.8,-.05]]; P.el=[-.35,-.35]; P.hipY=.95+Math.abs(Math.sin(ph))*.04; P.lean=a.speed>2.5?.15:.04; break; }
    case 'sit': case 'type': { P.hipY=.62; P.thigh=[-1.45,-1.45]; P.knee=[1.45,1.45];
      if(a.pose==='type'){ P.sh=[[-.95+Math.sin(t*14)*.05,.12],[-.95+Math.cos(t*13)*.05,-.12]]; P.el=[-.75,-.75]; P.lean=.12; }
      else { P.sh=[[-.5,.1],[-.5,-.1]]; P.el=[-.9,-.9]; } break; }
    case 'sitlow': { P.hipY=.72; P.thigh=[-1.35,-1.35]; P.knee=[1.35,1.35]; P.sh=[[-.4,.1],[-.4+(a.talking?Math.sin(t*6)*.35:0),-.1]]; P.el=[-.8,-.8-(a.talking?.4:0)]; break; }
    case 'sip': { P.sh=[[0,.05],[-1.0,-.1]]; P.el=[-.05,-2.05]; P.head=-.15; break; }
    case 'talk': { P.sh=[[-.3+Math.sin(t*5)*.25,.15],[-.2+Math.cos(t*4)*.3,-.2]]; P.el=[-.8,-.6]; break; }
    case 'cheer': { const j=Math.abs(Math.sin(t*7)); P.sh=[[-2.8,.3],[-2.8,-.3]]; P.el=[-.2,-.2]; P.hipY=.95+(a.pos.z<-4.5?-.33:j*.18); if(a.pos.z<-4.5){ P.thigh=[-1.45,-1.45]; P.knee=[1.45,1.45]; } break; }
    default: { P.sh=[[Math.sin(t*1.2)*.04,.05],[-Math.sin(t*1.2)*.04,-.05]]; }
  }
  if(a.cup.visible && a.pose!=='sip'){ P.sh[1]=[-.5,-.1]; P.el[1]=-1.35; }
  return P;
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(camT){ camT.k=Math.min(1,camT.k+dt*1.4); const e=camT.k<.5?2*camT.k*camT.k:1-Math.pow(-2*camT.k+2,2)/2; camera.position.lerpVectors(camT.p0,camT.p1,e); controls.target.lerpVectors(camT.t0,camT.t1,e); if(camT.k>=1) camT=null; }
  if(follow){ const a=follow; controls.target.lerp(new THREE.Vector3(a.pos.x,1.4,a.pos.z),.08); }
  TEAM.forEach(a=>{
    // jalan mengikuti rute, dengan percepatan halus
    if(a.path.length){ const p=a.path[0]; const dx=p.x-a.pos.x, dz=p.z-a.pos.z, d=Math.hypot(dx,dz);
      if(d<.06){ a.path.shift(); if(!a.path.length){ a.pose='stand'; const f=a.onArrive; a.onArrive=null; a.onAbort=null; f&&f(); } }
      else { const v=Math.min(d,a.speed*dt); a.pos.x+=dx/d*v; a.pos.z+=dz/d*v; a.face=Math.atan2(dx,dz); a.phase=(a.phase||0)+dt*a.speed*4.2; a.pose='walk'; } }
    if(a.face!==undefined){ let d=a.face-a.rot; d=Math.atan2(Math.sin(d),Math.cos(d)); a.rot+=d*Math.min(1,dt*8); }
    const P=targetPose(a,t+a.t), k=Math.min(1,dt*9), J=a.j;
    J.hipY=lerp(J.hipY,P.hipY,k); J.lean=lerp(J.lean,P.lean,k); J.head=lerp(J.head,P.head,k);
    for(let i=0;i<2;i++){ J.thigh[i]=lerp(J.thigh[i],P.thigh[i],k); J.knee[i]=lerp(J.knee[i],P.knee[i],k); J.sh[i][0]=lerp(J.sh[i][0],P.sh[i][0],k); J.sh[i][1]=lerp(J.sh[i][1],P.sh[i][1],k); J.el[i]=lerp(J.el[i],P.el[i],k); }
    const m=a.m; m.root.position.set(a.pos.x,0,a.pos.z); m.root.rotation.y=a.rot;
    m.hips.position.y=J.hipY+(a.pose==='stand'||a.pose==='talk'?Math.sin(t*2+a.t)*.008:0); m.hips.rotation.x=J.lean;
    m.legs.forEach((l,i)=>{ l.hp.rotation.x=J.thigh[i]; l.kn.rotation.x=J.knee[i]; });
    m.arms.forEach((r,i)=>{ r.sh.rotation.x=J.sh[i][0]; r.sh.rotation.z=J.sh[i][1]+(i?-.08:.08); r.el.rotation.x=J.el[i]; });
    m.head.rotation.x=J.head+(a.pose==='type'?.12:0); m.head.rotation.y=a.talking?Math.sin(t*2.3)*.18:Math.sin(t*.4+a.t)*.08;
    // kedip & mulut bicara
    a.blink-=dt; const bl=a.blink<0?.12:1; if(a.blink<-.12) a.blink=2+Math.random()*4; m.eyes.forEach(e=>e.scale.y=bl);
    m.mouth.scale.y=a.talking?.35+Math.abs(Math.sin(t*16))*.9:.35;
  });
  controls.update(); renderer.render(scene,camera); placeTags();
}

    const r=await fetch('status.json?t='+Date.now(),{cache:'no-store'}); let runs=r.ok?((await r.json()).runs||[]):[];
    try{ const rr=await fetch('reels.json?t='+Date.now(),{cache:'no-store'}); if(rr.ok) runs=runs.concat((await rr.json()).runs||[]); }catch(e){}
    runs.sort((a,b)=>String(a.finished||a.started).localeCompare(String(b.finished||b.started))); allRuns=runs; renderSched();
    const run=runs[runs.length-1]; if(!run) return;
    if(run.id!==lastId){ const fresh=!firstLoad; lastId=run.id; showPost(run);
      if(fresh) playRun(run); else { log('Sistem','Laporan terakhir: '+(run.label||'')+' — '+(run.title||'')); } }
    firstLoad=false;
  }catch(e){ renderSched(); }
}
async function pollLive(){
  try{ const r=await fetch(LIVE_URL+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const s=await r.json();
    if(s.busy && !liveBusy){ liveBusy=true; const job=s.jobs[0]||{team:'office'}; const ids=TEAMS[job.team]||TEAMS.office;
      summon(ids, job.team==='reels'?'Reels FYP (Reza)':job.team==='reply'?'Balas komentar (Fajar)':job.team==='analyze'?'Laporan mingguan':'Konten baru dikerjakan'); }
    else if(!s.busy && liveBusy){ liveBusy=false; if(!replaying) setTimeout(()=>{ if(!liveBusy && !replaying) dismiss(); },20000); }
  }catch(e){}
}

/* ---------- kontrol ---------- */
$('cam').onclick=()=>{ setCam((camIdx+1)%CAMS.length); $('cam').textContent='🎥 '+CAMS[camIdx].n; };
const roster=$('roster'); TEAM.forEach(a=>{ const b=document.createElement('button'); b.textContent=a.name+' · '+a.role; b.onclick=()=>{ follow=a; tweenCam([a.pos.x+3,4.2,a.pos.z+6],[a.pos.x,1.3,a.pos.z]); setTimeout(()=>{},0); }; roster.appendChild(b); });
$('tToday').onclick=()=>{ $('tToday').classList.add('on'); $('tWeek').classList.remove('on'); $('today').style.display=''; $('week').style.display='none'; };
$('tWeek').onclick=()=>{ $('tWeek').classList.add('on'); $('tToday').classList.remove('on'); $('today').style.display='none'; $('week').style.display='block'; };
document.querySelectorAll('.mtabs button').forEach(b=>b.onclick=()=>{ const c=$(b.dataset.c); const open=c.classList.contains('open'); document.querySelectorAll('.card').forEach(x=>x.classList.remove('open')); if(!open) c.classList.add('open'); });
canvas.addEventListener('pointerdown',()=>{ follow=null; });
document.querySelectorAll('.card h3').forEach(h=>h.onclick=()=>{ if(innerWidth>820) h.parentElement.classList.toggle('min'); });
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=innerWidth<820?55:42; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
function tick(){ const n=wib(); $('clock').textContent=String(n.hh).padStart(2,'0')+':'+String(n.hm%60).padStart(2,'0')+' WIB'; drawStand(n.hh); renderSched(); }
tick(); setInterval(tick,60000);
if(document.fonts) document.fonts.ready.then(()=>{ const n=wib(); drawStand(n.hh); renderSched(); TEAM.forEach(a=>setScreen(a,busyTeam.has(a.id))); });
TEAM.forEach(a=>{ a.face=Math.PI; setScreen(a,false); setTimeout(()=>life(a), Math.random()*4000); });
log('Sistem','Paddock dibuka · 9 karyawan siaga'); setState(false);
poll(); setInterval(poll,60000); pollLive(); setInterval(pollLive,15000);
animate();
</script>
